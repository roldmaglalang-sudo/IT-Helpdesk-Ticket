<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Helpdesk</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root{--ink:#16232e;--paper:#f2f4f3;--line:#d9dfdc;--accent:#17614f;--side:#16232e}
  body.role-employee{--accent:#0f766e;--side:#0b2f2c}
  body.role-it_support{--accent:#1d4ed8;--side:#12254a}
  body.role-admin{--accent:#6d28d9;--side:#2b1b4d}
  body{background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .side{background:var(--side);min-height:100vh}
  .side a{color:#cfd9e3;text-decoration:none;display:flex;justify-content:space-between;padding:.55rem 1rem;border-radius:6px}
  .side a:hover,.side a.on{background:rgba(255,255,255,.14);color:#fff}
  .brand{color:#fff;font-weight:700;font-size:1.15rem;padding:1rem 1rem .2rem}
  .chip{display:inline-block;margin:0 1rem 1rem;padding:.1rem .6rem;border-radius:20px;background:var(--accent);color:#fff;font-size:.75rem}
  .btn-main{background:var(--accent);color:#fff;border:0}.btn-main:hover{filter:brightness(.88);color:#fff}
  .panel{background:#fff;border:1px solid var(--line);border-radius:8px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem;border-left:4px solid var(--accent);height:100%}
  .stat .n{font-size:1.9rem;font-weight:700;line-height:1}
  .b-Low{background:#6c7a89}.b-Medium{background:#2f6fa5}.b-High{background:#c47a12}.b-Critical{background:#b3261e}
  .s-Open{background:#2f6fa5}.s-In-Progress{background:#7a4fb5}.s-Pending{background:#c47a12}.s-Resolved{background:#17714f}.s-Closed{background:#6c7a89}
  .msg{border-left:3px solid var(--line);padding:.4rem .8rem;margin-bottom:.8rem;white-space:pre-wrap;background:#fff}
  .msg.staff{border-color:var(--accent)} .msg.internal{border-color:#c47a12;background:#fff8e6}
  tr.click{cursor:pointer} :focus-visible{outline:3px solid #f0b429;outline-offset:2px}
  @media(max-width:767px){.side{min-height:0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ====== EDIT THESE 3 VALUES AFTER DEPLOYING THE BACKEND ====== */
const CFG = {
  API: "https://5hfueuevvjzaxb7vds4xsoakp40csowb.lambda-url.ap-southeast-1.on.aws",       // e.g. https://abc123.lambda-url.ap-southeast-1.on.aws
  REGION: "ap-southeast-1",
  CLIENT_ID: "4v6r1rk83koo32pptssq0svhmb"
};
/* ============================================================== */
const STATUSES=["Open","Pending","In Progress","Resolved","Closed"], PRIOS=["Low","Medium","High","Critical"];
const ROLE={employee:"Employee",it_support:"IT Support",admin:"IT Administrator"};
const TITLE={employee:"Employee Dashboard",it_support:"IT Support Dashboard",admin:"Administrator Dashboard"};
const NAV={
 employee:[["#/dashboard","Dashboard"],["#/tickets/all","My tickets"],["#/new","New ticket"],["#/notifications","Notifications"]],
 it_support:[["#/dashboard","Dashboard"],["#/tickets/available","Available tickets"],["#/tickets/mine","My assigned"],["#/tickets/all","All tickets"],["#/notifications","Notifications"]],
 admin:[["#/dashboard","Dashboard"],["#/users","Users and roles"],["#/tickets/all","All tickets"],["#/activity","IT activity"],["#/categories","Categories"]]};
const OK={employee:["dashboard","tickets","new","ticket","notifications"],it_support:["dashboard","tickets","ticket","notifications"],admin:["dashboard","users","tickets","ticket","activity","categories"]};
let S={me:null,cats:[]}, VIEW="all"; const F={q:"",status:"",priority:"",category:"",sort:"newest"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>d?new Date(String(d).replace(" ","T")).toLocaleString():"";
const sid=id=>"TKT-"+String(id).slice(0,8).toUpperCase();
const pb=p=>`<span class="badge b-${p}">${p}</span>`, sb=s=>`<span class="badge s-${s.replace(" ","-")}">${s}</span>`;
const opts=(arr,sel)=>arr.map(a=>`<option ${a===sel?"selected":""}>${a}</option>`).join("");
const flash=(m,ok)=>{const e=$("#flash");if(e){e.className="alert alert-"+(ok?"success":"danger");e.textContent=m;e.classList.remove("d-none");scrollTo(0,0)}};
const cards=a=>`<div class="row g-3 mb-4">${a.map(x=>`<div class="col-6 col-md-3 col-xl"><div class="stat"><div class="n">${x[1]}</div>${x[0]}</div></div>`).join("")}</div>`;

/* ---------- Cognito (direct API calls, no library) ---------- */
async function cog(target,body){
  const r=await fetch(`https://cognito-idp.${CFG.REGION}.amazonaws.com/`,{method:"POST",
    headers:{"Content-Type":"application/x-amz-json-1.1","X-Amz-Target":"AWSCognitoIdentityProviderService."+target},body:JSON.stringify(body)});
  const j=await r.json(); if(!r.ok) throw new Error(j.message||j.__type||"Request failed"); return j;
}
const keep=r=>{sessionStorage.setItem("at",r.AccessToken); if(r.RefreshToken) sessionStorage.setItem("rt",r.RefreshToken)};
async function refresh(){const j=await cog("InitiateAuth",{AuthFlow:"REFRESH_TOKEN_AUTH",ClientId:CFG.CLIENT_ID,AuthParameters:{REFRESH_TOKEN:sessionStorage.getItem("rt")}});keep(j.AuthenticationResult)}
function logout(){sessionStorage.clear();S.me=null;document.body.className="";location.hash="";showAuth()}

/* ---------- API ---------- */
async function api(path,o={},retry=true){
  const r=await fetch(CFG.API.replace(/\/$/,"")+path,{method:o.method||"GET",
    headers:{"Authorization":"Bearer "+(sessionStorage.getItem("at")||""),"Content-Type":"application/json"},
    body:o.body?JSON.stringify(o.body):undefined});
  if(r.status===401&&retry&&sessionStorage.getItem("rt")){try{await refresh();return api(path,o,false)}catch(e){logout();throw e}}
  const j=await r.json().catch(()=>({}));
  if(!r.ok){if(r.status===401)logout();throw new Error(j.error||"Request failed ("+r.status+")")}
  return j;
}

/* ---------- Auth screen ---------- */
function showAuth(mode="login",msg=""){
  $("#app").innerHTML=`<div class="container" style="max-width:440px;padding-top:9vh">
  <h1 class="h3 mb-1">IT Helpdesk</h1><p class="text-secondary">Report a problem and follow it until it is fixed.</p>
  <div class="panel p-4"><div id="flash" class="alert ${msg?"alert-info":"d-none"}">${esc(msg)}</div>
  ${mode==="login"?`<form onsubmit="return doLogin(event)">
    <label class="form-label">Email</label><input id="em" type="email" class="form-control mb-3" required autocomplete="username">
    <label class="form-label">Password</label><input id="pw" type="password" class="form-control mb-3" required autocomplete="current-password">
    <button class="btn btn-main w-100">Sign in</button></form>
    <p class="mt-3 mb-0 small">No account? <a href="#" onclick="showAuth('register');return false">Create one</a></p>`
  :mode==="register"?`<form onsubmit="return doReg(event)">
    <label class="form-label">Full name</label><input id="nm" class="form-control mb-3" required>
    <label class="form-label">Email</label><input id="em" type="email" class="form-control mb-3" required>
    <label class="form-label">Password</label><input id="pw" type="password" class="form-control" minlength="8" required>
    <div class="form-text mb-3">At least 8 characters with upper and lower case letters, a number and a symbol. A new account becomes the administrator of its own helpdesk. Employees and IT support accounts are created by that administrator.</div>
    <button class="btn btn-main w-100">Create account</button></form>
    <p class="mt-3 mb-0 small"><a href="#" onclick="showAuth('login');return false">Back to sign in</a></p>`
  :`<form onsubmit="return doConfirm(event)">
    <p>We sent a 6-digit code to <b>${esc(sessionStorage.getItem("pend"))}</b>.</p>
    <input id="cd" class="form-control mb-3" placeholder="Verification code" required>
    <button class="btn btn-main w-100">Verify email</button></form>`}
  </div></div>`;
}
async function doLogin(e){e.preventDefault();try{const j=await cog("InitiateAuth",{AuthFlow:"USER_PASSWORD_AUTH",ClientId:CFG.CLIENT_ID,AuthParameters:{USERNAME:$("#em").value.trim(),PASSWORD:$("#pw").value}});keep(j.AuthenticationResult);location.hash="#/dashboard";await start()}catch(x){flash(x.message)}return false}
async function doReg(e){e.preventDefault();const em=$("#em").value.trim();try{await cog("SignUp",{ClientId:CFG.CLIENT_ID,Username:em,Password:$("#pw").value,UserAttributes:[{Name:"email",Value:em},{Name:"name",Value:$("#nm").value.trim()}]});sessionStorage.setItem("pend",em);showAuth("confirm")}catch(x){flash(x.message)}return false}
async function doConfirm(e){e.preventDefault();try{await cog("ConfirmSignUp",{ClientId:CFG.CLIENT_ID,Username:sessionStorage.getItem("pend"),ConfirmationCode:$("#cd").value.trim()});showAuth("login","Email verified. You can sign in now.")}catch(x){flash(x.message)}return false}

/* ---------- Shell + router (each role gets its own dashboard and menu) ---------- */
async function start(){
  try{S.me=await api("/api/me");S.cats=await api("/api/categories")}catch(e){return showAuth("login",sessionStorage.getItem("at")?e.message:"")}
  const r=S.me.role; document.body.className="role-"+r;
  $("#app").innerHTML=`<div class="container-fluid"><div class="row">
   <nav class="col-md-2 side p-2" id="nav"><div class="brand">IT Helpdesk</div><span class="chip">${ROLE[r]}</span><div class="px-3 small text-light" style="opacity:.75;margin:-.6rem 0 .8rem">${esc(S.me.org_name)}</div>
     ${NAV[r].map(l=>`<a href="${l[0]}"><span>${l[1]}</span>${l[1]==="Notifications"?'<span id="nb" class="badge bg-danger d-none"></span>':""}</a>`).join("")}
     <div class="px-3 pt-4 small text-light">${esc(S.me.full_name)}<br><span class="text-secondary">${esc(S.me.email)}</span></div>
     <a href="#" onclick="logout();return false" class="mt-2">Sign out</a></nav>
   <main class="col-md-10 p-4"><div id="flash" class="alert d-none"></div><div id="view"></div></main></div></div>`;
  if(!location.hash||location.hash==="#")location.hash="#/dashboard"; route();
}
async function route(){
  if(!S.me)return; const h=location.hash||"#/dashboard", m=h.split("/"), p=m[1]||"dashboard";
  if(!OK[S.me.role].includes(p)){location.hash="#/dashboard";return}
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")===h));
  $("#flash").classList.add("d-none"); badge();
  try{
    if(p==="tickets")await vList(m[2]||"all"); else if(p==="new")vNew(); else if(p==="ticket")await vTicket(m[2]);
    else if(p==="notifications")await vNotifs(); else if(p==="users")await vUsers(); else if(p==="activity")await vActivity();
    else if(p==="categories")await vCats(); else await({employee:vEmpDash,it_support:vItDash,admin:vAdminDash})[S.me.role]();
  }catch(e){flash(e.message)}
}
addEventListener("hashchange",route);
async function badge(){if(S.me.role==="admin")return;try{const n=(await api("/api/notifications")).unread,b=$("#nb");if(b){b.textContent=n;b.classList.toggle("d-none",!n)}}catch(e){}}

/* ---------- Tables ---------- */
function table(rows){
  if(!rows.length)return `<div class="panel p-4 text-secondary">No tickets here yet.</div>`;
  return `<div class="panel table-responsive"><table class="table table-hover mb-0 align-middle"><thead><tr><th>ID</th><th>Title</th><th>Category</th><th>Priority</th><th>Status</th><th>Submitted by</th><th>Assigned to</th><th>Created</th></tr></thead><tbody>`+
  rows.map(t=>`<tr class="click" onclick="location.hash='#/ticket/${t.id}'"><td>${sid(t.id)}</td><td>${esc(t.subject)}</td><td>${esc(t.category)}</td><td>${pb(t.priority)}</td><td>${sb(t.status)}</td><td>${esc(t.created_by_name)}</td><td>${esc(t.assigned_name||"Unassigned")}</td><td>${fmt(t.created_at)}</td></tr>`).join("")+`</tbody></table></div>`;
}
const actTable=a=>a.length?`<div class="panel table-responsive"><table class="table mb-0 align-middle"><thead><tr><th>When</th><th>IT support</th><th>Ticket</th><th>Action</th></tr></thead><tbody>`+
  a.map(x=>`<tr class="click" onclick="location.hash='#/ticket/${x.ticket_id}'"><td>${fmt(x.created_at)}</td><td>${esc(x.actor)}</td><td>${sid(x.ticket_id)} ${esc(x.subject)}</td><td>${esc(x.details)}</td></tr>`).join("")+`</tbody></table></div>`:`<div class="panel p-4 text-secondary">No IT activity yet.</div>`;

/* ---------- Dashboards ---------- */
async function vEmpDash(){
  const [st,ts]=await Promise.all([api("/api/stats"),api("/api/tickets?sort=newest")]), b=st.by_status;
  $("#view").innerHTML=`<div class="d-flex justify-content-between mb-3"><h2 class="h4">${TITLE.employee}</h2><a class="btn btn-main" href="#/new">New ticket</a></div>`+
   cards([["My tickets",st.total],["Open",b.Open||0],["In Progress",b["In Progress"]||0],["Pending",b.Pending||0],["Resolved or closed",(b.Resolved||0)+(b.Closed||0)]])+
   `<h3 class="h5">Recent tickets</h3>`+table(ts.slice(0,6));
}
async function vItDash(){
  const [st,av,mi]=await Promise.all([api("/api/stats"),api("/api/tickets?view=available&sort=priority"),api("/api/tickets?view=mine&sort=priority")]), b=st.by_status;
  $("#view").innerHTML=`<h2 class="h4 mb-3">${TITLE.it_support}</h2>`+
   cards([["Available to pick up",st.available],["Assigned to me",st.mine],["Open",b.Open||0],["Pending",b.Pending||0],["In Progress",b["In Progress"]||0],["Resolved",b.Resolved||0]])+
   `<h3 class="h5">Available tickets</h3>`+table(av.slice(0,6))+`<h3 class="h5 mt-4">Assigned to me</h3>`+table(mi.filter(t=>!["Resolved","Closed"].includes(t.status)).slice(0,6));
}
async function vAdminDash(){
  const [st,ts,ac]=await Promise.all([api("/api/stats"),api("/api/tickets?sort=newest"),api("/api/activity")]), b=st.by_status, u=st.users||{};
  $("#view").innerHTML=`<h2 class="h4 mb-3">${TITLE.admin}</h2>`+
   cards([["Employees",u.employee||0],["IT support staff",u.it_support||0],["Total tickets",st.total]])+
   cards([["Open",b.Open||0],["Pending",b.Pending||0],["In Progress",b["In Progress"]||0],["Resolved",b.Resolved||0],["Closed",b.Closed||0]])+
   `<h3 class="h5">Latest IT activity</h3>`+actTable(ac.slice(0,8))+`<h3 class="h5 mt-4">Latest tickets</h3>`+table(ts.slice(0,6));
}

/* ---------- Ticket list with search, filter, sort ---------- */
const VT={all:"All tickets",available:"Available tickets",mine:"My assigned tickets"};
async function vList(view){
  if(view!==undefined&&view!==VIEW){VIEW=view;Object.assign(F,{q:"",status:"",priority:"",category:"",sort:"newest"})}
  const qs=new URLSearchParams({view:VIEW}); for(const k in F) if(F[k]) qs.set(k,F[k]);
  const ts=await api("/api/tickets?"+qs);
  const title=S.me.role==="employee"?"My tickets":VT[VIEW]||"Tickets";
  $("#view").innerHTML=`<h2 class="h4 mb-3">${title}</h2><div class="row g-2 mb-3">
   <div class="col-md-4"><input id="fq" class="form-control" placeholder="Search title or ticket ID" value="${esc(F.q)}" onkeydown="if(event.key==='Enter')applyF()"></div>
   <div class="col-6 col-md-2"><select id="fs" class="form-select" onchange="applyF()"><option value="">All statuses</option>${opts(STATUSES,F.status)}</select></div>
   <div class="col-6 col-md-2"><select id="fp" class="form-select" onchange="applyF()"><option value="">All priorities</option>${opts(PRIOS,F.priority)}</select></div>
   <div class="col-6 col-md-2"><select id="fc" class="form-select" onchange="applyF()"><option value="">All categories</option>${S.cats.map(c=>`<option value="${c.id}" ${c.id===F.category?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div>
   <div class="col-6 col-md-2"><select id="fo" class="form-select" onchange="applyF()">${[["newest","Newest first"],["oldest","Oldest first"],["priority","Priority"],["status","Status"],["updated","Recently updated"]].map(o=>`<option value="${o[0]}" ${o[0]===F.sort?"selected":""}>${o[1]}</option>`).join("")}</select></div>
  </div>`+table(ts);
}
function applyF(){F.q=$("#fq").value.trim();F.status=$("#fs").value;F.priority=$("#fp").value;F.category=$("#fc").value;F.sort=$("#fo").value;vList()}

/* ---------- New ticket (employee) ---------- */
function vNew(){
  $("#view").innerHTML=`<h2 class="h4 mb-3">Submit an IT support request</h2><form class="panel p-4" onsubmit="return mkTicket(event)">
   <label class="form-label">Title</label><input id="sj" class="form-control mb-3" maxlength="200" required>
   <div class="row"><div class="col-md-6 mb-3"><label class="form-label">Category</label><select id="ct" class="form-select">${S.cats.filter(c=>c.is_active).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div>
   <div class="col-md-6 mb-3"><label class="form-label">Priority</label><select id="pr" class="form-select">${opts(PRIOS,"Medium")}</select></div></div>
   <label class="form-label">Description</label><textarea id="ds" class="form-control mb-3" rows="5" required></textarea>
   <label class="form-label">Screenshots, images or documents (optional, up to 5 MB each)</label><input id="fl" type="file" multiple class="form-control mb-3">
   <button class="btn btn-main" id="sb">Submit ticket</button></form>`;
}
async function mkTicket(e){
  e.preventDefault();$("#sb").disabled=true;
  try{
    const t=await api("/api/tickets",{method:"POST",body:{subject:$("#sj").value,description:$("#ds").value,category_id:$("#ct").value,priority:$("#pr").value}});
    for(const f of $("#fl").files)await upload(t.id,f);
    location.hash="#/ticket/"+t.id;
  }catch(x){flash(x.message);$("#sb").disabled=false}
  return false;
}
async function upload(tid,f){
  const ct=f.type||"application/octet-stream";
  const p=await api(`/api/tickets/${tid}/attachments/presign`,{method:"POST",body:{file_name:f.name,content_type:ct,size:f.size}});
  const r=await fetch(p.upload_url,{method:"PUT",headers:{"Content-Type":ct},body:f});
  if(!r.ok)throw new Error("Upload to storage failed for "+f.name);
  await api(`/api/tickets/${tid}/attachments`,{method:"POST",body:p});
}

/* ---------- Ticket detail ---------- */
async function vTicket(id){
  const d=await api("/api/tickets/"+id), t=d.ticket, r=S.me.role, staff=r!=="employee"?await api("/api/staff"):[];
  const canWork=r==="it_support"&&(!t.assigned_to||t.assigned_to===S.me.id), canAssign=r==="admin"||canWork, canUpload=r==="employee"||canWork, canReply=r==="employee"||canWork;
  $("#view").innerHTML=`<a href="#/tickets/all">&larr; Back to tickets</a>
  <div class="d-flex flex-wrap gap-2 align-items-center my-2"><h2 class="h4 mb-0">${esc(t.subject)}</h2>${pb(t.priority)}${sb(t.status)}</div>
  <p class="text-secondary">${sid(t.id)} &bull; ${esc(t.category)} &bull; submitted by ${esc(t.created_by_name)} on ${fmt(t.created_at)}</p>
  <div class="row g-3"><div class="col-lg-8">
   <div class="panel p-3 mb-3"><div style="white-space:pre-wrap">${esc(t.description)}</div></div>
   <h3 class="h6">Conversation</h3>
   ${d.messages.map(m=>`<div class="msg ${m.is_internal?"internal":m.sender_role!=="employee"?"staff":""}"><b>${esc(m.sender)}</b> ${m.is_internal?'<span class="badge bg-warning text-dark">Internal note</span>':""} <span class="text-secondary small">${fmt(m.created_at)}</span><br>${esc(m.body)}</div>`).join("")||'<p class="text-secondary">No messages yet.</p>'}
   ${r==="admin"?'<p class="small text-secondary">Administrator view: you can monitor everything here. Employees and IT support handle the replies.</p>':
    canReply?`<div class="panel p-3"><textarea id="mb" class="form-control mb-2" rows="3" placeholder="Write a message"></textarea>
     ${r==="it_support"?'<div class="form-check mb-2"><input id="inl" type="checkbox" class="form-check-input"><label class="form-check-label small" for="inl">Internal note (only IT support and administrators can see it)</label></div>':""}
     <button class="btn btn-main" onclick="sendMsg('${t.id}')">Send</button></div>`:'<p class="small text-secondary">This ticket is assigned to another IT support member, so only they can reply or update it.</p>'}
   <h3 class="h6 mt-4">Ticket history</h3>
   <ul class="list-unstyled small">${d.logs.map(l=>`<li class="mb-1"><span class="text-secondary">${fmt(l.created_at)}</span> &bull; <b>${esc(l.actor)}</b>: ${esc(l.details)}${l.is_internal?' <span class="badge bg-warning text-dark">internal</span>':""}</li>`).join("")}</ul>
  </div><div class="col-lg-4">
   <div class="panel p-3 mb-3"><h3 class="h6">Details</h3><div class="small mb-2">Assigned to: <b>${esc(t.assigned_name||"Unassigned")}</b></div>
    ${canWork?`<label class="form-label small">Status</label><select class="form-select mb-2" onchange="upd('${t.id}',{status:this.value})">${opts(STATUSES,t.status)}</select>
     <label class="form-label small">Priority</label><select class="form-select mb-2" onchange="upd('${t.id}',{priority:this.value})">${opts(PRIOS,t.priority)}</select>
     <button class="btn btn-sm btn-outline-success mb-2" onclick="upd('${t.id}',{status:'Resolved'})">Mark as resolved</button>`:""}
    ${canAssign?`<label class="form-label small">Assign to</label><select class="form-select" onchange="upd('${t.id}',{assigned_to:this.value})"><option value="">Unassigned</option>${staff.map(s=>`<option value="${s.id}" ${s.id===t.assigned_to?"selected":""}>${esc(s.full_name)}${s.id===S.me.id?" (me)":""}</option>`).join("")}</select>`:""}
    ${r==="employee"?(t.status==="Resolved"||t.status==="Closed"?`<button class="btn btn-sm btn-outline-secondary" onclick="upd('${t.id}',{status:'Open'})">Reopen</button> `:"")+(t.status!=="Closed"?`<button class="btn btn-sm btn-outline-secondary" onclick="upd('${t.id}',{status:'Closed'})">Close ticket</button>`:""):""}
   </div>
   <div class="panel p-3"><h3 class="h6">Attachments</h3>
    ${d.attachments.map(a=>`<div class="small mb-1"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.file_name)}</a> <span class="text-secondary">${Math.ceil(a.size_bytes/1024)} KB, ${esc(a.uploader)}</span></div>`).join("")||'<p class="small text-secondary">No files attached.</p>'}
    ${canUpload?`<input id="af" type="file" class="form-control form-control-sm mt-2"><button class="btn btn-sm btn-outline-secondary mt-2" onclick="addFile('${t.id}')">Upload file</button>`:""}
   </div></div></div>`;
}
async function sendMsg(id){const b=$("#mb").value.trim();if(!b)return;try{await api(`/api/tickets/${id}/messages`,{method:"POST",body:{body:b,internal:!!($("#inl")&&$("#inl").checked)}});await vTicket(id)}catch(e){flash(e.message)}}
async function upd(id,body){try{await api("/api/tickets/"+id,{method:"PATCH",body});await vTicket(id)}catch(e){await vTicket(id);flash(e.message)}}
async function addFile(id){const f=$("#af").files[0];if(!f)return flash("Choose a file first");try{await upload(id,f);await vTicket(id)}catch(e){flash(e.message)}}

/* ---------- Notifications ---------- */
async function vNotifs(){
  const n=await api("/api/notifications");
  $("#view").innerHTML=`<div class="d-flex justify-content-between mb-3"><h2 class="h4">Notifications</h2><button class="btn btn-sm btn-outline-secondary" onclick="readAll()">Mark all as read</button></div>`+
  (n.items.length?`<div class="panel"><ul class="list-group list-group-flush">`+n.items.map(i=>`<li class="list-group-item ${i.is_read?"":"fw-bold"} click" style="cursor:pointer" onclick="location.hash='#/ticket/${i.ticket_id}'">${esc(i.message)}<div class="small text-secondary fw-normal">${fmt(i.created_at)}</div></li>`).join("")+`</ul></div>`:`<div class="panel p-4 text-secondary">No notifications yet.</div>`);
}
async function readAll(){await api("/api/notifications/read",{method:"POST",body:{}});await vNotifs();badge()}

/* ---------- Administrator pages ---------- */
async function vActivity(){$("#view").innerHTML=`<h2 class="h4 mb-3">IT support activity</h2><p class="text-secondary">The latest actions by IT support staff: assignments, status changes, replies and notes.</p>`+actTable(await api("/api/activity"))}
async function vUsers(){
  const us=await api("/api/users");
  $("#view").innerHTML=`<h2 class="h4 mb-3">Users and roles</h2>
  <form class="panel p-3 mb-3" onsubmit="return mkUser(event)"><h3 class="h6">Create an account</h3><div class="row g-2">
   <div class="col-md-3"><input id="un" class="form-control" placeholder="Full name" required></div>
   <div class="col-md-3"><input id="ue" type="email" class="form-control" placeholder="Email" required></div>
   <div class="col-md-2"><input id="up" type="text" class="form-control" placeholder="Password" required></div>
   <div class="col-md-2"><select id="ur" class="form-select">${Object.keys(ROLE).map(k=>`<option value="${k}">${ROLE[k]}</option>`).join("")}</select></div>
   <div class="col-md-2"><button class="btn btn-main w-100">Create</button></div></div>
   <div class="form-text">Password: 8+ characters with upper and lower case, a number and a symbol. Accounts you create belong only to your helpdesk.</div></form>
  <div class="panel table-responsive"><table class="table mb-0 align-middle"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Active</th><th></th></tr></thead><tbody>`+
  us.map(u=>{const me=u.id===S.me.id;return `<tr><td>${esc(u.full_name)}</td><td>${esc(u.email)}</td>
   <td><select class="form-select form-select-sm w-auto" ${me?"disabled":""} onchange="setUser('${u.id}',{role:this.value})">${Object.keys(ROLE).map(k=>`<option value="${k}" ${k===u.role?"selected":""}>${ROLE[k]}</option>`).join("")}</select></td>
   <td><input type="checkbox" class="form-check-input" ${u.is_active?"checked":""} ${me?"disabled":""} onchange="setUser('${u.id}',{is_active:this.checked})"></td>
   <td class="text-end"><button class="btn btn-sm btn-outline-danger" ${me?"disabled":""} onclick="delUser('${u.id}','${esc(u.full_name).replace(/'/g,"")}')">Delete</button></td></tr>`}).join("")+`</tbody></table></div>`;
}
async function mkUser(e){e.preventDefault();try{const r=await api("/api/users",{method:"POST",body:{full_name:$("#un").value,email:$("#ue").value,password:$("#up").value,role:$("#ur").value}});await vUsers();flash(r.note||"Account created",true)}catch(x){flash(x.message)}return false}
async function delUser(id,name){if(!confirm("Delete the account of "+name+"?\nThis cannot be undone."))return;try{await api("/api/users/"+id,{method:"DELETE"});await vUsers();flash("Account deleted",true)}catch(e){await vUsers();flash(e.message)}}
async function setUser(id,b){try{await api("/api/users/"+id,{method:"PATCH",body:b});await vUsers();flash("Saved",true)}catch(e){await vUsers();flash(e.message)}}
async function vCats(){
  S.cats=await api("/api/categories");
  $("#view").innerHTML=`<h2 class="h4 mb-3">Ticket categories</h2><div class="panel p-3 mb-3"><div class="input-group"><input id="cn" class="form-control" placeholder="New category name"><button class="btn btn-main" onclick="addCat()">Add category</button></div></div>
  <div class="panel"><ul class="list-group list-group-flush">`+S.cats.map(c=>`<li class="list-group-item d-flex justify-content-between align-items-center">${esc(c.name)}
   <button class="btn btn-sm btn-outline-secondary" onclick="togCat('${c.id}')">${c.is_active?"Disable":"Enable"}</button></li>`).join("")+`</ul></div>`;
}
async function addCat(){try{await api("/api/categories",{method:"POST",body:{name:$("#cn").value}});await vCats()}catch(e){flash(e.message)}}
async function togCat(id){try{await api(`/api/categories/${id}/toggle`,{method:"POST",body:{}});await vCats()}catch(e){flash(e.message)}}

sessionStorage.getItem("at")?start():showAuth();
</script>
</body>
</html>
